<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>JanCode 智能体</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
  :root{--bg:240 20% 98%;--panel:0 0% 100%;--panel2:240 20% 96%;--line:240 14% 89%;
        --fg:240 12% 15%;--dim:240 8% 45%;--accent:258 88% 62%;--accent2:192 85% 40%;
        --ok:150 60% 34%;--bad:0 68% 48%;--warn:38 88% 44%}
  *{box-sizing:border-box}
  html,body{height:100%;margin:0}
  body{background:hsl(var(--bg));color:hsl(var(--fg));display:flex;overflow:hidden;
       font:13px/1.6 -apple-system,"PingFang SC","Microsoft YaHei",system-ui,sans-serif}
  aside{width:266px;flex:none;background:hsl(var(--panel));border-right:1px solid hsl(var(--line));
        display:flex;flex-direction:column;height:100%}
  .brand{padding:14px 16px;font-weight:600;font-size:14px;display:flex;align-items:center;gap:8px;
         border-bottom:1px solid hsl(var(--line))}
  .dot{width:8px;height:8px;border-radius:50%;background:linear-gradient(135deg,hsl(var(--accent)),hsl(var(--accent2)))}
  .newbtn{margin:12px;padding:9px 12px;border-radius:8px;cursor:pointer;font-size:13px;font-weight:600;
          background:linear-gradient(135deg,hsl(var(--accent)),hsl(var(--accent2)));color:#fff;border:0}
  .newbtn:hover{filter:brightness(1.08)}
  .side-scroll{flex:1;overflow-y:auto;padding:0 8px 8px}
  .side-title{padding:10px 8px 6px;font-size:11px;color:hsl(var(--dim))}
  .sitem{padding:8px 10px;border-radius:7px;cursor:pointer;display:flex;gap:8px;align-items:baseline}
  .sitem:hover{background:hsl(var(--panel2))}
  .sitem.active{background:hsl(var(--panel2));box-shadow:inset 2px 0 0 hsl(var(--accent))}
  .sitem .t{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .sitem .d{font-size:10.5px;color:hsl(var(--dim));flex:none}
  .sitem .x{opacity:0;color:hsl(var(--dim));flex:none}
  .sitem:hover .x{opacity:1}
  .empty{padding:8px 10px;color:hsl(var(--dim));font-size:12px}
  .info{border-top:1px solid hsl(var(--line));padding:10px 14px;font-size:11.5px;color:hsl(var(--dim))}
  .info div{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .info b{color:hsl(var(--fg));font-weight:500}
  main{flex:1;display:flex;flex-direction:column;height:100%;min-width:0}
  header{padding:12px 18px;border-bottom:1px solid hsl(var(--line));background:hsl(var(--panel));
         display:flex;align-items:center;gap:10px}
  header .ttl{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  header .sp{flex:1}
  .ghost{background:transparent;color:hsl(var(--dim));border:1px solid hsl(var(--line));border-radius:7px;
         padding:5px 10px;cursor:pointer;font-size:12px}
  .ghost:hover{color:hsl(var(--fg));border-color:hsl(var(--accent))}
  #log{flex:1;overflow-y:auto;padding:18px 18px 8px}
  .welcome{max-width:620px;margin:7vh auto 0;text-align:center;color:hsl(var(--dim))}
  .welcome h1{font-size:19px;color:hsl(var(--fg));margin:0 0 10px}
  .tips{margin-top:18px;display:grid;gap:8px}
  .tip{background:hsl(var(--panel));border:1px solid hsl(var(--line));border-radius:9px;
       padding:10px 12px;text-align:left;cursor:pointer;font-size:12.5px}
  .tip:hover{border-color:hsl(var(--accent));color:hsl(var(--fg))}
  .turn{background:hsl(var(--panel));border:1px solid hsl(var(--line));border-radius:10px;
        padding:10px 12px;margin:0 auto 12px;max-width:900px}
  .turn-head{display:flex;align-items:center;gap:8px;font-size:11px;color:hsl(var(--dim));margin-bottom:6px}
  .turn-head .idx{color:hsl(var(--accent2));font-weight:600}
  .turn-head .sp{flex:1}
  .turn-head .act{cursor:pointer;opacity:.6}
  .turn-head .act:hover{opacity:1;color:hsl(var(--fg))}
  .st{width:7px;height:7px;border-radius:50%;background:hsl(var(--warn))}
  .st.ok{background:hsl(var(--ok))}
  .st.bad{background:hsl(var(--bad))}
  .you{white-space:pre-wrap;word-break:break-word}
  .you::before{content:"你  ";color:hsl(var(--accent));font-weight:600}
  .ans{margin-top:6px;white-space:pre-wrap;word-break:break-word}
  .ans::before{content:"智能体  ";color:hsl(var(--accent2));font-weight:600}
  .chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
  .chip{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11px;background:hsl(var(--panel2));
        border:1px solid hsl(var(--line));border-radius:6px;padding:3px 7px;cursor:pointer;color:hsl(var(--dim));
        max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .chip:hover{color:hsl(var(--fg));border-color:hsl(var(--accent))}
  .chip.ok{border-left:2px solid hsl(var(--ok))}
  .chip.bad{border-left:2px solid hsl(var(--bad));color:hsl(var(--bad))}
  .chip.sub{border-style:dashed}
  .chip-body{margin-top:6px;padding:8px 10px;background:#f4f4f8;border:1px solid hsl(var(--line));
             border-radius:7px;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11.5px;
             white-space:pre-wrap;word-break:break-word;max-height:320px;overflow:auto;color:hsl(var(--dim))}
  .err{color:hsl(var(--bad));margin-top:6px;white-space:pre-wrap}
  .composer{border-top:1px solid hsl(var(--line));padding:12px 18px 14px;background:hsl(var(--panel))}
  .cwrap{max-width:900px;margin:0 auto}
  textarea{width:100%;min-height:74px;max-height:240px;resize:vertical;background:hsl(var(--panel2));
           color:hsl(var(--fg));border:1px solid hsl(var(--line));border-radius:9px;padding:10px 12px;
           font:inherit;outline:none}
  textarea:focus{border-color:hsl(var(--accent))}
  .crow{display:flex;align-items:center;gap:10px;margin-top:8px}
  .crow .hint{color:hsl(var(--dim));font-size:11.5px;flex:1}
  button.primary{background:linear-gradient(135deg,hsl(var(--accent)),hsl(var(--accent2)));color:#fff;
                 border:0;border-radius:8px;padding:8px 18px;font-weight:600;cursor:pointer;font-size:13px}
  button.primary:disabled{opacity:.5;cursor:default}
  .chipbtn{display:inline-flex;align-items:center;gap:6px;cursor:pointer;font-size:12px;
           background:hsl(var(--panel2));border:1px solid hsl(var(--line));border-radius:7px;
           padding:5px 10px;color:hsl(var(--fg));max-width:320px}
  .chipbtn:hover{border-color:hsl(var(--accent))}
  .chipbtn span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .chipbtn .ar{color:hsl(var(--dim));font-size:10px;flex:none}
  .mpick{display:none;margin-top:8px;background:hsl(var(--panel2));border:1px solid hsl(var(--line));
         border-radius:9px;max-height:280px;overflow:auto}
  .mpick.on{display:block}
  .mpick .mi{padding:7px 10px;cursor:pointer;font-size:12.5px;display:flex;gap:8px;align-items:center}
  .mpick .mi:hover{background:hsl(var(--line))}
  .mpick .mi.cur{color:hsl(var(--accent2))}
  .mpick .mi .cap{font-size:10.5px;color:hsl(var(--dim));flex:none}
  .mpick .mh{padding:8px 10px;font-size:11px;color:hsl(var(--dim));border-bottom:1px solid hsl(var(--line))}
  .nav{padding:0 8px 8px}
  .nitem{display:flex;align-items:center;gap:9px;padding:8px 10px;border-radius:7px;
         cursor:pointer;color:hsl(var(--dim));font-size:12.5px}
  .nitem:hover{background:hsl(var(--panel2));color:hsl(var(--fg))}
  .nitem.on{background:hsl(var(--panel2));color:hsl(var(--fg));
            box-shadow:inset 2px 0 0 hsl(var(--accent))}
  .nitem .ni{width:16px;text-align:center;font-size:12px;opacity:.85}
  .view{display:none;flex:1;flex-direction:column;min-height:0}
  .view.on{display:flex}
  .pane{flex:1;overflow-y:auto;padding:16px 18px}
  .pane h2{margin:0 0 4px;font-size:15px}
  .pane .sub{color:hsl(var(--dim));font-size:12px;margin-bottom:14px}
  .crumb{display:flex;gap:6px;align-items:center;flex-wrap:wrap;font-size:12px;margin-bottom:12px;
         color:hsl(var(--dim))}
  .crumb b{color:hsl(var(--accent2));cursor:pointer;font-weight:500}
  .flist{display:grid;gap:4px;max-width:900px}
  .frow{display:flex;gap:10px;align-items:center;padding:7px 10px;border-radius:7px;cursor:pointer;
        border:1px solid transparent}
  .frow:hover{background:hsl(var(--panel));border-color:hsl(var(--line))}
  .frow .nm{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
            font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px}
  .frow .sz{color:hsl(var(--dim));font-size:11px;flex:none}
  .frow.dir .nm{color:hsl(var(--accent2))}
  .filepre{margin-top:14px;background:#f4f4f8;border:1px solid hsl(var(--line));border-radius:9px;
           padding:12px;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11.5px;
           white-space:pre-wrap;word-break:break-word;max-height:52vh;overflow:auto;color:hsl(var(--dim))}
  .card{background:hsl(var(--panel));border:1px solid hsl(var(--line));border-radius:10px;
        padding:12px 14px;margin-bottom:10px;max-width:900px}
  .card .h{display:flex;gap:8px;align-items:center;margin-bottom:5px}
  .card .h b{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12.5px;
             color:hsl(var(--accent2));font-weight:600}
  .card .d{color:hsl(var(--dim));font-size:12px}
  .pills{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
  .pill{font-size:11.5px;padding:4px 9px;border-radius:20px;background:hsl(var(--panel2));
        border:1px solid hsl(var(--line));color:hsl(var(--dim))}
  .pill.on{border-color:hsl(var(--ok));color:hsl(var(--fg))}
  .mlist{display:grid;gap:3px;max-width:720px}
  .mli{padding:8px 12px;border-radius:7px;cursor:pointer;font-family:ui-monospace,monospace;
       font-size:12.5px;display:flex;gap:10px;align-items:center}
  .mli:hover{background:hsl(var(--panel))}
  .mli.cur{background:hsl(var(--panel));box-shadow:inset 2px 0 0 hsl(var(--accent2))}
  .mli .tag{font-family:-apple-system,sans-serif;font-size:10.5px;color:hsl(var(--dim))}
  .mask{position:fixed;inset:0;background:rgba(20,20,35,.35);display:none;align-items:center;justify-content:center}
  .mask.on{display:flex}
  .dlg{background:hsl(var(--panel));border:1px solid hsl(var(--line));border-radius:12px;
       width:560px;max-width:92vw;padding:18px 20px}
  .dlg h2{margin:0 0 12px;font-size:15px}
  .field{margin-bottom:14px}
  .field label{display:block;font-size:12px;color:hsl(var(--dim));margin-bottom:5px}
  .field input{width:100%;background:hsl(var(--panel2));color:hsl(var(--fg));border:1px solid hsl(var(--line));
               border-radius:7px;padding:8px 10px;font:inherit;outline:none}
  .field .note{font-size:11px;color:hsl(var(--dim));margin-top:5px}
  .kv{font-size:12px;color:hsl(var(--dim));margin-bottom:14px;line-height:1.9}
  .kv b{color:hsl(var(--fg));font-weight:500}
  .drow{display:flex;justify-content:flex-end;gap:10px}
</style>

<style>
/* ===== 统一界面覆盖层：只覆盖，不改旧规则 ===== */
:root{--b1:#7c5cff;--b2:#35c3e8;--card:#fff;--edge:#ececf1;--edge2:#d9d9e3;--ink:#1f2328;--mut:#6b7280;--soft:#f7f7f9}
html,body{background:var(--soft)!important;color:var(--ink)}
aside,.sidebar,#side,#sidebar{width:252px!important;min-width:252px!important;background:#fbfbfc!important;border-right:1px solid var(--edge)!important;padding:12px!important}
main,.main,#main{background:var(--soft)!important}
/* 侧栏菜单项：高一点、圆角、选中浅紫 + 左侧竖条 */
/* 只作用于侧栏里的菜单项。之前没限定范围，把带 data-view 的视图容器
   也变成了 36px 高的横条——整块内容被压没了，页面一片空白。 */
aside [data-view],.sidebar [data-view],#side [data-view],#sidebar [data-view]{display:flex!important;align-items:center;gap:9px;height:36px;padding:0 10px!important;border-radius:9px!important;font-size:13.5px;color:#3d434c!important;cursor:pointer;position:relative;transition:.14s}
aside [data-view]:hover,.sidebar [data-view]:hover,#side [data-view]:hover,#sidebar [data-view]:hover{background:#f1f1f5!important}
aside [data-view].active,aside [data-view][aria-selected="true"],.sidebar [data-view].active,.sidebar [data-view][aria-selected="true"]{background:#f2f0ff!important;color:#5b3ee8!important;font-weight:600}
aside [data-view].active:before,aside [data-view][aria-selected="true"]:before,.sidebar [data-view].active:before,.sidebar [data-view][aria-selected="true"]:before{content:"";position:absolute;left:0;top:9px;bottom:9px;width:3px;border-radius:0 3px 3px 0;background:linear-gradient(180deg,var(--b1),var(--b2))}
/* 卡片网格 */
#skillsBody{display:grid!important;grid-template-columns:repeat(auto-fill,minmax(420px,1fr))!important;gap:16px!important;align-content:start}
.mg-card{background:#f8f8f9!important;border:1px solid transparent!important;border-radius:14px!important;padding:20px!important;display:flex!important;gap:16px!important;align-items:flex-start!important;box-shadow:none!important}
.mg-card:hover{background:#f4f4f6!important;transform:none!important}
.mg-main{flex:1;min-width:0}
.mg-head{display:flex;align-items:center;justify-content:space-between;gap:12px}
.mg-tile{width:56px!important;height:56px!important;border-radius:11px!important;font-size:24px!important;margin:0!important}
.mg-name{font-size:17px!important;font-weight:650}
.mg-desc{font-size:13.5px!important;color:#6b7280!important;line-height:1.6;margin-top:7px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.mg-tags{margin-top:13px!important;font-size:13px!important;color:#9aa1ab!important}
.mg-btn{position:static!important;height:30px!important;padding:0 12px!important;border-radius:8px!important;border:1px solid #e3e3e8!important;background:#fff!important;font-size:13px!important;gap:5px;flex:none}
.mg-btn:hover{border-color:#c9b8ff!important;color:#5b3ee8!important}
/* 分类页签：纯文字 + 选中下划线，不用胶囊 */
.mg-pill{background:none!important;padding:6px 0!important;border-radius:0!important;font-size:14px!important;color:#6b7280!important;border-bottom:2px solid transparent;margin-right:20px}
.mg-pill.on{background:none!important;color:#1f2328!important;font-weight:650;border-bottom-color:#1f2328}
#mg-cats{border-bottom:1px solid #ececf1;width:100%;padding-bottom:0;gap:0!important;overflow-x:auto;flex-wrap:nowrap}
#skillsBody>*,#agentsBody>*,#toolsBody>*{background:var(--card)!important;border:1px solid var(--edge)!important;border-radius:12px!important;padding:16px 16px 12px!important;position:relative;box-shadow:0 1px 2px rgba(16,24,40,.05);transition:.16s;min-height:132px;display:flex;flex-direction:column;gap:6px}
#skillsBody>*:hover,#agentsBody>*:hover,#toolsBody>*:hover{border-color:var(--edge2)!important;box-shadow:0 2px 10px rgba(16,24,40,.09);transform:translateY(-1px)}
.mg-tile{width:44px;height:44px;border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:19px;flex:none;margin-bottom:2px}
.mg-desc{font-size:13px;color:var(--mut);line-height:1.55;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.mg-name{font-size:15px;font-weight:650;letter-spacing:.1px}
.mg-tags{margin-top:auto;font-size:12.5px;color:#9aa1ab;display:flex;gap:6px;align-items:center}
.mg-btn{position:absolute;right:12px;top:14px;height:28px;padding:0 11px;border-radius:7px;border:1px solid var(--edge);background:#fff;font-size:12.5px;color:#4b5563;cursor:pointer}
.mg-btn:hover{border-color:#c9b8ff;color:#5b3ee8}
.mg-tag-static{position:absolute;right:12px;top:16px;font-size:12px;color:#a2a8b2}
/* 顶部工具条：页签 + 搜索 */
.mg-bar{display:flex;align-items:center;gap:12px;margin:2px 0 14px;flex-wrap:wrap}
.mg-tab{padding:7px 2px;font-size:14px;color:var(--mut);cursor:pointer;border-bottom:2px solid transparent;margin-right:6px}
.mg-tab.on{color:var(--ink);font-weight:650;border-bottom-color:var(--ink)}
.mg-pill{padding:5px 13px;border-radius:999px;background:#f1f1f5;font-size:12.5px;color:#4b5563;cursor:pointer}
.mg-pill.on{background:#efeaff;color:#5b3ee8;font-weight:600}
.mg-search{margin-left:auto;height:40px;min-width:240px;flex:1;border:1px solid var(--edge);border-radius:10px;padding:0 14px;background:#fff;font-size:13.5px;outline:none}
.mg-search:focus{border-color:var(--b1);box-shadow:0 0 0 3px rgba(124,92,255,.13)}
.mg-empty{grid-column:1/-1;text-align:center;color:var(--mut);padding:46px 0;font-size:13.5px}
/* 按钮与输入 */
button.primary,.primary{background:linear-gradient(135deg,var(--b1),var(--b2))!important;color:#fff!important;border:none!important;border-radius:10px!important;font-weight:600!important}
input,textarea,select{border-radius:10px!important;border:1px solid var(--edge)!important;background:#fff!important}
input:focus,textarea:focus,select:focus{outline:none!important;border-color:var(--b1)!important;box-shadow:0 0 0 3px rgba(124,92,255,.13)!important}
::-webkit-scrollbar{width:8px;height:8px}::-webkit-scrollbar-thumb{background:#d4d4dc;border-radius:99px}::-webkit-scrollbar-thumb:hover{background:#bcbcc8}
</style>
</head>
<body>
<aside>
  <div class="brand"><span class="dot"></span> JanCode 智能体</div>
  <button class="newbtn" id="newChat">＋ 新建对话</button>
  <div class="side-scroll">
    <div class="nav">
      <div class="nitem on" data-view="chat"><span class="ni">◈</span>对话</div>
      <div class="nitem" data-view="files"><span class="ni">▤</span>文件</div>
      <div class="nitem" data-view="tools"><span class="ni">⚙</span>工具与技能</div>
      <div class="nitem" data-view="skills"><span class="ni">✦</span>技能</div>
      <div class="nitem" data-view="agents"><span class="ni">☰</span>智能体</div>
      <div class="nitem" data-view="models"><span class="ni">◆</span>模型</div>
    </div>
    <div class="side-title">对话历史</div>
    <div id="sessions"></div>
  </div>
  <div class="info">
    <div>工作区 <b id="ws">—</b></div>
    <div>智能体 <b id="agnow">默认</b></div>
    <div>模型 <b id="mdl">—</b></div>
    <div id="wpush">微信推送 未开启</div>
    <div style="margin-top:6px"><span class="act" id="setBtn2" style="cursor:pointer">设置与微信推送</span></div>
  </div>
</aside>
<main>
  <header>
    <div class="ttl" id="ttl">新对话</div>
    <div class="sp"></div>
    <button class="ghost" id="clearBtn">清空本对话</button>
    <button class="ghost" id="setBtn">设置</button>
  </header>
  <div class="view on" id="view-chat">
    <div id="log"></div>
  <div class="composer">
    <div class="cwrap">
      <textarea id="input" placeholder="描述你要做的事…（Enter 发送，Shift+Enter 换行）"></textarea>
      <div class="crow">
        <span class="chipbtn" id="modelBtn" title="点这里换模型">
          <span id="modelName">模型加载中…</span><span class="ar">▾</span>
        </span>
        <div class="hint" id="hint">就绪</div>
        <button class="primary" id="send">发送</button>
      </div>
      <div class="mpick" id="mpick"></div>
    </div>
  </div>
  </div>
  <div class="view" id="view-files"><div class="pane" id="filesBody"></div></div>
  <div class="view" id="view-tools"><div class="pane" id="toolsBody"></div></div>
  <div class="view" id="view-skills"><div class="pane" id="skillsBody"></div></div>
  <div class="view" id="view-agents"><div class="pane" id="agentsBody"></div></div>
  <div class="view" id="view-models"><div class="pane" id="modelsBody"></div></div>
</main>
<div class="mask" id="mask">
  <div class="dlg">
    <h2>设置</h2>
    <div class="kv" id="setInfo"></div>
    <div class="field">
      <label>接口地址（中转站）</label>
      <input id="setBase" placeholder="https://你的中转站/v1">
    </div>
    <div class="field">
      <label>API 密钥</label>
      <input id="setKey" type="password" placeholder="sk-...（留空表示不改）">
      <div class="note">存在 ~/.jancode-agent/desktop-settings.json，权限 600。不放进浏览器存储。</div>
    </div>
    <div class="field">
      <label>默认模型</label>
      <input id="setModel" placeholder="例如 gpt-5.4">
      <div class="note">也可以在输入框那一行点模型名随时切换，不影响这里。</div>
    </div>
    <div class="field">
      <label>微信推送（企业微信群机器人 Webhook）</label>
      <input id="hook" placeholder="https://qyapi.weixin.qq.com/cgi-bin/webhook/send?key=...">
      <div class="note">填上后，每个任务完成时会把结论推到群里。留空即关闭。其他平台暂不支持。</div>
    </div>
    <div class="drow">
      <button class="ghost" id="hookTest">发一条测试</button>
      <button class="primary" id="setSave">保存</button>
    </div>
  </div>
</div>
<script>
(function () {
  "use strict";
  var $ = function (id) { return document.getElementById(id); };
  var log = $("log"), input = $("input"), sendBtn = $("send"), hint = $("hint");
  var info = {}, store = loadStore();
  var cur = store.current ? find(store.current) : null;
  // 开局先建一个空对话。不建的话左侧「对话历史」是空的，
  // 用户看到的是一个什么都没有的栏目，只会以为功能坏了。
  if (!cur) { cur = newSession(); }
  var busy = false, live = null;
  var models = [];

  function loadStore() {
    var raw = null;
    try { raw = JSON.parse(localStorage.getItem("jancode.sessions") || "null"); } catch (e) { raw = null; }
    if (!raw || typeof raw !== "object") raw = { list: [], current: null, hook: "" };
    if (!Array.isArray(raw.list)) raw.list = [];
    if (typeof raw.hook !== "string") raw.hook = "";
    return raw;
  }
  function save() { try { localStorage.setItem("jancode.sessions", JSON.stringify(store)); } catch (e) {} }
  function find(id) { for (var i = 0; i < store.list.length; i++) if (store.list[i].id === id) return store.list[i]; return null; }
  function esc(s) {
    return String(s == null ? "" : s).replace(/&/g, "&amp;").replace(/</g, "&lt;")
      .replace(/>/g, "&gt;").replace(/"/g, "&quot;");
  }
  function pad(n) { return (n < 10 ? "0" : "") + n; }
  function clock(ts) {
    var d = new Date(ts);
    return pad(d.getMonth() + 1) + "/" + pad(d.getDate()) + " " + pad(d.getHours()) + ":" + pad(d.getMinutes());
  }
  function newSession() {
    var s = { id: "s" + Date.now().toString(36), title: "新对话", turns: [], ts: Date.now() };
    store.list.unshift(s); store.current = s.id; save();
    return s;
  }

  fetch("/api/info").then(function (r) { return r.json(); }).then(function (d) {
    info = d;
    $("ws").textContent = d.workspace; $("ws").title = d.workspace;
    $("mdl").textContent = (d.label ? d.label + " · " : "") + d.model;
    $("mdl").title = d.base_url;
    if (!d.has_key) hint.textContent = "还没有配置密钥：点右下角「设置」填上接口地址和密钥";
    renderSide(); renderMain();
  }).catch(function () { hint.textContent = "无法连接本地服务"; });

  function modelLabel() { return store.model || info.model || "默认模型"; }

  fetch("/api/models").then(function (r) { return r.json(); }).then(function (d) {
    models = d.models || [];
    renderModel();
  }).catch(function () { renderModel(); });

  function renderModel() {
    $("modelName").textContent = modelLabel();
    $("mdl").textContent = (info.label ? info.label + " · " : "") + modelLabel();
    $("mdl").title = info.base_url || "";
    var buf = '<div class="mh">选中后对之后的任务生效</div>';
    for (var i = 0; i < models.length; i++) {
      var m = models[i];
      buf += '<div class="mi' + (m === modelLabel() ? " cur" : "") + '" data-m="' + esc(m) + '">' +
             '<span>' + esc(m) + '</span>' +
             (m === info.model ? '<span class="cap">启动时的模型</span>' : "") + '</div>';
    }
    if (!models.length) buf += '<div class="mi">没有取到模型列表，检查中转站是否可连</div>';
    $("mpick").innerHTML = buf;
  }

  $("modelBtn").onclick = function (e) {
    e.stopPropagation();
    $("mpick").classList.toggle("on");
  };
  $("mpick").addEventListener("click", function (e) {
    var row = e.target.closest ? e.target.closest(".mi") : null;
    if (!row) return;
    var m = row.getAttribute("data-m");
    if (!m) return;
    store.model = m;
    save();
    renderModel();
    $("mpick").classList.remove("on");
    hint.textContent = "已切换到 " + m + "，下一个任务生效";
  });
  document.addEventListener("click", function (e) {
    if (!$("mpick").contains(e.target) && e.target !== $("modelBtn")) $("mpick").classList.remove("on");
  });

  function renderSide() {
    $("wpush").textContent = store.hook ? "微信推送 已开启" : "微信推送 未开启";
    if (models.length || store.model) renderModel();
    $("agnow").textContent = store.agent || "默认";
    var box = $("sessions");
    if (!store.list.length) { box.innerHTML = '<div class="empty">还没有对话</div>'; return; }
    var buf = "";
    for (var i = 0; i < store.list.length; i++) {
      var s = store.list[i];
      buf += '<div class="sitem' + (cur && s.id === cur.id ? " active" : "") + '" data-id="' + s.id + '">' +
             '<span class="t">' + esc(s.title) + '</span>' +
             '<span class="d">' + clock(s.ts) + '</span>' +
             '<span class="x" data-del="' + s.id + '">✕</span></div>';
    }
    box.innerHTML = buf;
  }

  $("sessions").addEventListener("click", function (e) {
    var del = e.target.getAttribute && e.target.getAttribute("data-del");
    if (del) {
      e.stopPropagation();
      store.list = store.list.filter(function (s) { return s.id !== del; });
      if (store.current === del) { store.current = store.list.length ? store.list[0].id : null; }
      cur = store.current ? find(store.current) : null;
      save(); renderSide(); renderMain(); return;
    }
    var row = e.target.closest ? e.target.closest(".sitem") : null;
    if (!row) return;
    store.current = row.getAttribute("data-id"); cur = find(store.current);
    save(); renderSide(); renderMain();
  });

  function tipsBox() {
    var w = document.createElement("div");
    w.className = "welcome";
    w.innerHTML = "<h1>要做什么？</h1><div>直接说人话就行——它会自己读文件、跑命令、改代码。" +
                  "任务大就派给子智能体，每一步都能看到。</div>";
    var tips = document.createElement("div");
    tips.className = "tips";
    var list = ["看看这个项目是干什么的，用三句话说明",
                "找出这个仓库里所有 TODO，按优先级列出来",
                "跑一遍测试，失败的给我原因"];
    for (var i = 0; i < list.length; i++) {
      (function (txt) {
        var d = document.createElement("div");
        d.className = "tip"; d.textContent = txt;
        d.onclick = function () { input.value = txt; input.focus(); };
        tips.appendChild(d);
      })(list[i]);
    }
    w.appendChild(tips);
    return w;
  }

  function renderMain() {
    $("ttl").textContent = (cur && cur.title) ? cur.title : "新对话";
    log.innerHTML = "";
    if (!cur || !cur.turns.length) { log.appendChild(tipsBox()); return; }
    for (var i = 0; i < cur.turns.length; i++) log.appendChild(turnEl(cur.turns[i], i));
    log.scrollTop = log.scrollHeight;
  }

  function turnEl(t, index) {
    var el = document.createElement("div");
    el.className = "turn";
    var cls = t.status === "ok" ? "ok" : (t.status === "bad" ? "bad" : "");
    var head = document.createElement("div");
    head.className = "turn-head";
    head.innerHTML = '<span class="st ' + cls + '"></span><span class="idx">#' + (index + 1) + '</span>' +
      '<span>' + clock(t.ts) + '</span>' + (t.secs ? '<span>· ' + t.secs + ' 秒</span>' : "") +
      '<span class="sp"></span>' +
      '<span class="act" data-copy="' + index + '">复制</span>' +
      '<span class="act" data-again="' + index + '">重跑</span>';
    el.appendChild(head);
    var you = document.createElement("div");
    you.className = "you"; you.textContent = t.prompt;
    el.appendChild(you);
    if (t.answer) {
      var ans = document.createElement("div");
      ans.className = "ans"; ans.textContent = t.answer;
      el.appendChild(ans);
    }
    if (t.tools && t.tools.length) el.appendChild(chipsEl(t.tools));
    if (t.error) {
      var er = document.createElement("div");
      er.className = "err"; er.textContent = "✗ " + t.error;
      el.appendChild(er);
    }
    return el;
  }

  function chipsEl(tools) {
    var box = document.createElement("div");
    box.className = "chips";
    for (var i = 0; i < tools.length; i++) {
      (function (tool, idx) {
        var c = document.createElement("div");
        c.className = "chip" + (tool.ok === true ? " ok" : (tool.ok === false ? " bad" : "")) + (tool.sub ? " sub" : "");
        c.textContent = (tool.sub ? "↳ [" + tool.sub + "] " : "") + tool.name +
                        (tool.text ? "  " + String(tool.text).split("\n")[0].slice(0, 90) : " …");
        var body = null;
        c.onclick = function () {
          if (body) { body.remove(); body = null; return; }
          body = document.createElement("div");
          body.className = "chip-body";
          body.textContent = tool.text || "（没有输出）";
          box.parentNode.insertBefore(body, box.nextSibling);
        };
        box.appendChild(c);
      })(tools[i], i);
    }
    return box;
  }

  function pushTurn(t) {
    if (!cur) cur = newSession();
    cur.turns.push(t);
    if (cur.title === "新对话") cur.title = t.prompt.slice(0, 22);
    cur.ts = Date.now();
    save();
  }
  function history() {
    var h = [];
    if (!cur) return h;
    for (var i = 0; i < cur.turns.length; i++) {
      h.push({ role: "user", content: cur.turns[i].prompt });
      if (cur.turns[i].answer) h.push({ role: "assistant", content: cur.turns[i].answer });
    }
    return h.slice(-20);
  }

  function setBusy(on) {
    busy = on;
    sendBtn.disabled = on;
    sendBtn.textContent = on ? "执行中…" : "发送";
  }

  // 插话改成「排队」而不是真并发：live 是全局的流式渲染状态，
  // 两轮同时跑会互相覆盖，第二轮的回答写进第一轮的格子，看起来像没反应。
  // 排队的体感一样（消息立刻进列表），但渲染不会串。
  var mgQueue = [];
  function run(prompt) {
    if (busy || live) {
      mgQueue.push(prompt);
      var b = document.getElementById("mg-queue");
      if (b) {
        b.style.display = "block";
        b.textContent = "已排队 " + mgQueue.length + " 条，这轮结束后自动跑";
      }
      if (hint) hint.textContent = "已排队 " + mgQueue.length + " 条";
      return;
    }
    return runNow(prompt);
  }
  async function mgDrain() {
    if (busy || live || !mgQueue.length) return;
    var next = mgQueue.shift();
    var b = document.getElementById("mg-queue");
    if (b) {
      if (mgQueue.length) b.textContent = "还剩 " + mgQueue.length + " 条排队";
      else b.style.display = "none";
    }
    await runNow(next);
  }

  async function runNow(prompt) {
    // 允许插话：运行中也能继续发。上一版只解禁了按钮，没动这里，
    // 所以点得动但发不出去——闸门在这个 busy 判断上。
    // 服务端是多线程的，能同时跑多轮；发送按钮的禁用状态也已不再拦。
    if (!prompt) return;
    var turn = { prompt: prompt, answer: "", tools: [], error: "", status: "", ts: Date.now() };
    pushTurn(turn);
    cur.title = cur.title; renderSide(); renderMain();
    live = { turn: turn, node: null };
    setBusy(true);
    hint.textContent = "执行中…";

    var started = Date.now();
    try {
      var res = await fetch("/api/run", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ prompt: prompt, history: history(), model: store.model || "", agent: store.agent || "" })
      });
      if (!res.ok) {
        var msg = "服务返回 " + res.status;
        try { var j = await res.json(); if (j.error) msg = j.error; } catch (e) {}
        throw new Error(msg);
      }
      var reader = res.body.getReader(), dec = new TextDecoder(), buf = "";
      while (true) {
        var chunk = await reader.read();
        if (chunk.done) break;
        buf += dec.decode(chunk.value, { stream: true });
        var lines = buf.split("\n");
        buf = lines.pop();
        for (var i = 0; i < lines.length; i++) {
          var s = lines[i].trim();
          if (!s) continue;
          var ev = null;
          try { ev = JSON.parse(s); } catch (e) { continue; }
          handle(ev, turn);
        }
      }
      turn.status = turn.error ? "bad" : "ok";
    } catch (e) {
      turn.status = "bad";
      turn.error = String(e.message || e);
    }
    turn.secs = ((Date.now() - started) / 1000).toFixed(1);
    live = null;
    setBusy(false);
    hint.textContent = "就绪";
    mgDrain();
    save(); renderSide(); renderMain();
    notify(turn);
  }

  function handle(ev, turn) {
    if (ev.kind === "tool") {
      var last = turn.tools.length ? turn.tools[turn.tools.length - 1] : null;
      if (ev.text === "" || ev.text == null) {
        turn.tools.push({ name: ev.tool || "工具", text: "", ok: null, sub: ev.subagent || "" });
      } else if (last && last.name === (ev.tool || "工具") && last.sub === (ev.subagent || "")) {
        last.text = ev.text; last.ok = ev.ok;
      } else {
        turn.tools.push({ name: ev.tool || "工具", text: ev.text, ok: ev.ok, sub: ev.subagent || "" });
      }
    } else if (ev.kind === "answer") {
      if (ev.subagent) {
        turn.tools.push({ name: "子智能体结论", text: ev.text, ok: true, sub: ev.subagent });
      } else {
        turn.answer = (turn.answer ? turn.answer + "\n" : "") + ev.text;
      }
    } else if (ev.kind === "error") {
      turn.error = (ev.subagent ? "[" + ev.subagent + "] " : "") + ev.text;
    } else if (ev.kind === "done") {
      // 服务端在流结尾显式发一个 done。靠「流断了」判断结束是不可靠的：
      // 连接被中途掐断和正常跑完，在 fetch 这一侧长得一模一样。
      if (!turn.error) turn.status = "ok";
    }
    if (cur) { renderMain(); }
  }

  function notify(turn) {
    if (!store.hook) return;
    var text = "【JanCode】任务完成\n" + turn.prompt.slice(0, 60) +
               (turn.answer ? "\n\n" + turn.answer.slice(0, 500) : "") +
               (turn.error ? "\n\n失败：" + turn.error.slice(0, 200) : "");
    fetch("/api/notify", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ webhook: store.hook, text: text })
    }).catch(function () {});
  }

  sendBtn.onclick = function () {
    var v = input.value.trim();
    if (!v) return;
    input.value = "";
    run(v);
  };
  input.onkeydown = function (e) {
    if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); sendBtn.onclick(); }
  };
  // ---------- 左侧功能页 ----------
  var view = "chat", curPath = ".", skills = [], agents = [];

  function showView(name) {
    view = name;
    var items = document.querySelectorAll(".nitem");
    for (var i = 0; i < items.length; i++) {
      items[i].classList.toggle("on", items[i].getAttribute("data-view") === name);
    }
    var names = ["chat", "files", "skills", "agents", "models", "tools"];
    for (var j = 0; j < names.length; j++) {
      var box = $("view-" + names[j]);
      if (box) box.classList.toggle("on", names[j] === name);
    }
    $("clearBtn").style.display = (name === "chat") ? "" : "none";
    if (name === "files") loadFiles(curPath);
    if (name === "skills") loadSkills();
    if (name === "agents") loadAgents();
    if (name === "models") renderModelsPage();
    if (name === "tools") loadTools();
  }
  var navItems = document.querySelectorAll(".nitem");
  for (var ni = 0; ni < navItems.length; ni++) {
    (function (el) { el.onclick = function () { showView(el.getAttribute("data-view")); }; })(navItems[ni]);
  }

  function postJson(url, body, then) {
    fetch(url, {
      method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body)
    }).then(function (r) { return r.json(); }).then(function (d) {
      if (d && d.ok === false) { hint.textContent = d.error || "保存失败"; }
      if (then) then(d);
    }).catch(function () { hint.textContent = "连不上本地服务"; });
  }
  function fmtSize(n) { return n >= 1024 ? (n / 1024).toFixed(1) + " KB" : n + " B"; }

  function loadFiles(path) {
    curPath = path || ".";
    fetch("/api/files?path=" + encodeURIComponent(curPath)).then(function (r) { return r.json(); }).then(function (d) {
      if (!d.ok) { $("filesBody").innerHTML = '<h2>文件</h2><div class="sub">' + esc(d.error) + '</div>'; return; }
      var parts = curPath === "." ? [] : curPath.split("/");
      var crumb = '<b data-p=".">工作目录</b>', acc = "";
      for (var i = 0; i < parts.length; i++) {
        acc = acc ? acc + "/" + parts[i] : parts[i];
        crumb += ' / <b data-p="' + esc(acc) + '">' + esc(parts[i]) + '</b>';
      }
      var rows = "";
      for (var j = 0; j < d.entries.length; j++) {
        var e = d.entries[j];
        rows += '<div class="frow' + (e.dir ? " dir" : "") + '" data-n="' + esc(e.name) + '" data-d="' + (e.dir ? 1 : 0) + '">' +
                '<span class="nm">' + esc(e.name) + (e.dir ? "/" : "") + '</span>' +
                '<span class="sz">' + (e.dir ? "" : fmtSize(e.size)) + '</span></div>';
      }
      $("filesBody").innerHTML = '<h2>文件</h2><div class="sub">工作目录里的文件。点目录进去，点文件看内容。</div>' +
        '<div class="crumb">' + crumb + '</div>' +
        '<div class="flist">' + (rows || '<div class="frow"><span class="nm">（空目录）</span></div>') + '</div>' +
        '<div id="filepre"></div>';
      var marks = $("filesBody").querySelectorAll(".crumb b");
      for (var k = 0; k < marks.length; k++) marks[k].onclick = function () { loadFiles(this.getAttribute("data-p")); };
      var fr = $("filesBody").querySelectorAll(".frow");
      for (var m = 0; m < fr.length; m++) fr[m].onclick = function () { openEntry(this); };
    }).catch(function () { $("filesBody").innerHTML = '<h2>文件</h2><div class="sub">连不上本地服务</div>'; });
  }

  function openEntry(row) {
    var name = row.getAttribute("data-n");
    if (!name) return;
    var full = curPath === "." ? name : curPath + "/" + name;
    if (row.getAttribute("data-d") === "1") { loadFiles(full); return; }
    var box = $("filepre");
    if (box) box.innerHTML = '<div class="filepre">读取中…</div>';
    fetch("/api/file?path=" + encodeURIComponent(full)).then(function (r) { return r.json(); }).then(function (d) {
      if (box) box.innerHTML = '<div class="filepre">' + esc(d.ok ? d.text : d.error) + '</div>';
    });
  }

  function loadTools() {
    fetch("/api/tools").then(function (r) { return r.json(); }).then(function (d) {
      var buf = '<h2>工具与技能</h2><div class="sub">智能体能调用的能力，以及当前的开关（由启动参数决定）。</div>' +
        '<div class="pills">' +
        '<span class="pill' + (d.allow_bash ? " on" : "") + '">shell 命令 ' + (d.allow_bash ? "开" : "关") + '</span>' +
        '<span class="pill' + (d.allow_subagents ? " on" : "") + '">子智能体 ' + (d.allow_subagents ? "开" : "关") + '</span>' +
        '<span class="pill">单个任务最多 ' + d.max_steps + ' 步</span></div>';
      for (var i = 0; i < d.tools.length; i++) {
        buf += '<div class="card"><div class="h"><b>' + esc(d.tools[i].name) + '</b></div>' +
               '<div class="d">' + esc(d.tools[i].description) + '</div></div>';
      }
      $("toolsBody").innerHTML = buf;
    }).catch(function () { $("toolsBody").innerHTML = '<h2>工具</h2><div class="sub">连不上本地服务</div>'; });
  }

  function pickModel(m) {
    if (!m) return;
    store.model = m;
    save();
    renderModel();
    if (view === "models") renderModelsPage();
    hint.textContent = "已切换到 " + m + "，下一个任务生效";
  }

  function renderModelsPage() {
    var buf = '<h2>模型</h2><div class="sub">列表从中转站实时读取。点一个就切换，之后的任务都用它。</div><div class="mlist">';
    for (var i = 0; i < models.length; i++) {
      var m = models[i];
      buf += '<div class="mli' + (m === modelLabel() ? " cur" : "") + '" data-m="' + esc(m) + '">' + esc(m) +
             (m === info.model ? '<span class="tag">启动时的模型</span>' : '') + '</div>';
    }
    if (!models.length) buf += '<div class="mli">没有取到模型列表，检查中转站是否可连</div>';
    $("modelsBody").innerHTML = buf + '</div>';
    var rows = $("modelsBody").querySelectorAll(".mli");
    for (var j = 0; j < rows.length; j++) rows[j].onclick = function () { pickModel(this.getAttribute("data-m")); };
  }

  function loadSkills() {
    fetch("/api/skills").then(function (r) { return r.json(); }).then(function (d) {
      skills = d.skills || [];
      var buf = '<h2>技能</h2><div class="sub">你写的做法，智能体每次都照做；它自己摸索出经验时也会用 save_skill 存进来。</div>' +
        '<div class="card"><div class="h"><b>新建技能</b></div>' +
        '<div class="field"><input id="skName" placeholder="技能名，例如：发版流程"></div>' +
        '<div class="field"><input id="skDesc" placeholder="一句话说明什么时候用"></div>' +
        '<div class="field"><textarea id="skBody" style="min-height:90px" placeholder="具体做法，写成照着做就能复现的样子"></textarea></div>' +
        '<div class="drow"><button class="primary" id="skSave">保存技能</button></div></div>';
      for (var i = 0; i < skills.length; i++) {
        var s = skills[i];
        buf += '<div class="card"><div class="h"><b>' + esc(s.name) + '</b>' +
               '<span class="tag" style="margin-left:auto;cursor:pointer" data-del="' + esc(s.name) + '">删除</span></div>' +
               '<div class="d">' + esc(s.description || "（没有说明）") + '</div>' +
               '<div class="filepre" style="max-height:180px">' + esc(s.content) + '</div></div>';
      }
      if (!skills.length) buf += '<div class="sub" style="margin-top:12px">还没有技能。上面写一条，或者让智能体自己总结一条。</div>';
      $("skillsBody").innerHTML = buf;
      $("skSave").onclick = function () {
        postJson("/api/skills", {
          name: $("skName").value, description: $("skDesc").value, content: $("skBody").value
        }, function (d) { if (d.ok) { hint.textContent = "技能已保存"; loadSkills(); } });
      };
      var dels = $("skillsBody").querySelectorAll("[data-del]");
      for (var j = 0; j < dels.length; j++) dels[j].onclick = function () {
        postJson("/api/skills", { delete: this.getAttribute("data-del") }, loadSkills);
      };
    }).catch(function () { $("skillsBody").innerHTML = '<h2>技能</h2><div class="sub">连不上本地服务</div>'; });
  }

  function loadAgents() {
    fetch("/api/agents").then(function (r) { return r.json(); }).then(function (d) {
      agents = d.agents || [];
      var opts = "";
      for (var i = 0; i < skills.length; i++) {
        opts += '<label class="pill" style="cursor:pointer"><input type="checkbox" class="skpick" value="' +
                esc(skills[i].name) + '"> ' + esc(skills[i].name) + '</label>';
      }
      var buf = '<h2>智能体</h2><div class="sub">建几个各有分工的智能体：给它一段角色设定、一个默认模型、用哪些技能。' +
        '在下面「使用」一个，之后的任务就按它的设定来。</div>' +
        '<div class="card"><div class="h"><b>新建智能体</b></div>' +
        '<div class="field"><input id="agName" placeholder="名字，例如：前端重构手"></div>' +
        '<div class="field"><textarea id="agPrompt" style="min-height:90px" placeholder="角色设定：它该怎么干活、注意什么"></textarea></div>' +
        '<div class="field"><input id="agModel" placeholder="默认模型（留空则用当前模型）"></div>' +
        '<div class="field"><label>这个智能体用哪些技能</label><div class="pills">' + (opts || '<span class="sub">先去「技能」页建一条</span>') + '</div></div>' +
        '<div class="drow"><button class="primary" id="agSave">保存智能体</button></div></div>';
      for (var j = 0; j < agents.length; j++) {
        var a = agents[j];
        buf += '<div class="card"><div class="h"><b>' + esc(a.name) + '</b>' +
          (a.model ? '<span class="tag">' + esc(a.model) + '</span>' : '') +
          '<span class="tag" style="margin-left:auto;cursor:pointer" data-use="' + esc(a.name) + '">使用</span>' +
          '<span class="tag" style="cursor:pointer" data-rm="' + esc(a.name) + '">删除</span></div>' +
          '<div class="d">' + esc(a.system_prompt || "（没有角色设定）") + '</div>' +
          (a.skills && a.skills.length ? '<div class="d">技能：' + esc(a.skills.join("、")) + '</div>' : '') + '</div>';
      }
      $("agentsBody").innerHTML = buf;
      $("agSave").onclick = function () {
        var picked = [];
        var boxes = $("agentsBody").querySelectorAll(".skpick");
        for (var k = 0; k < boxes.length; k++) if (boxes[k].checked) picked.push(boxes[k].value);
        postJson("/api/agents", {
          name: $("agName").value, system_prompt: $("agPrompt").value,
          model: $("agModel").value, skills: picked
        }, function (r) { if (r.ok) { hint.textContent = "智能体已保存"; loadAgents(); } });
      };
      var uses = $("agentsBody").querySelectorAll("[data-use]");
      for (var m = 0; m < uses.length; m++) uses[m].onclick = function () {
        store.agent = this.getAttribute("data-use");
        save();
        $("agnow").textContent = store.agent;
        hint.textContent = "已切换到智能体「" + store.agent + "」";
      };
      var rms = $("agentsBody").querySelectorAll("[data-rm]");
      for (var n = 0; n < rms.length; n++) rms[n].onclick = function () {
        var who = this.getAttribute("data-rm");
        if (store.agent === who) { store.agent = ""; $("agnow").textContent = "默认"; save(); }
        postJson("/api/agents", { delete: who }, loadAgents);
      };
    }).catch(function () { $("agentsBody").innerHTML = '<h2>智能体</h2><div class="sub">连不上本地服务</div>'; });
  }

  $("newChat").onclick = function () {
    cur = newSession(); save(); renderSide(); renderMain(); input.focus();
  };
  $("clearBtn").onclick = function () {
    if (!cur) return;
    cur.turns = []; cur.title = "新对话"; save(); renderSide(); renderMain();
  };
  log.addEventListener("click", function (e) {
    var a = e.target.getAttribute && e.target.getAttribute("data-copy");
    var b = e.target.getAttribute && e.target.getAttribute("data-again");
    if (a != null && cur) {
      var t = cur.turns[Number(a)];
      if (t) { try { navigator.clipboard.writeText(t.answer || ""); hint.textContent = "已复制"; } catch (err) {} }
    } else if (b != null && cur) {
      var t2 = cur.turns[Number(b)];
      if (t2) run(t2.prompt);
    }
  });
  $("setBtn2").onclick = function () { $("setBtn").onclick(); };
  $("setBtn").onclick = function () {
    $("setInfo").innerHTML =
      "供应商 <b>" + esc(info.label || "-") + "</b><br>" +
      "接口 <b>" + esc(info.base_url || "-") + "</b><br>" +
      "模型 <b>" + esc(info.model || "-") + "</b><br>" +
      "工作区 <b>" + esc(info.workspace || "-") + "</b><br>" +
      "密钥 <b>" + (info.has_key ? "已配置" : "未配置") + "</b>";
    $("hook").value = store.hook || "";
    $("setKey").value = "";
    fetch("/api/settings").then(function (r) { return r.json(); }).then(function (d) {
      $("setBase").value = d.base_url || "";
      $("setModel").value = d.model || "";
      $("setInfo").innerHTML = "当前供应商 <b>" + esc(d.label || "-") + "</b>　密钥 <b>" +
        (d.has_key ? (d.key_from_env ? "来自环境变量" : "已配置") : "未配置") + "</b>";
    });
    $("mask").classList.add("on");
  };
  $("mask").onclick = function (e) { if (e.target === $("mask")) $("mask").classList.remove("on"); };
  $("setSave").onclick = function () {
    store.hook = $("hook").value.trim(); save(); renderSide();
    postJson("/api/settings", {
      base_url: $("setBase").value, api_key: $("setKey").value, model: $("setModel").value
    }, function () {
      hint.textContent = "设置已保存";
      fetch("/api/models").then(function (r) { return r.json(); }).then(function (d) {
        models = d.models || []; renderModel();
      });
      $("mask").classList.remove("on");
    });
  };
  $("hookTest").onclick = function () {
    var url = $("hook").value.trim();
    if (!url) { hint.textContent = "先填 webhook 地址"; return; }
    store.hook = url; save(); renderSide();
    fetch("/api/notify", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ webhook: url, text: "【JanCode】微信推送测试，收到即说明配置正确。" })
    }).then(function (r) { return r.json(); }).then(function (d) {
      hint.textContent = d.ok ? "测试消息已发送" : ("发送失败：" + (d.error || "未知原因"));
    }).catch(function () { hint.textContent = "发送失败：连不上本地服务"; });
  };
})();
</script>

<script>
/* 装饰层：只读原有 DOM 再包一层，任何错误都不影响原功能 */
(function(){
  var TILES=['#eef2ff','#e0f2fe','#f0fdf4','#fef3c7','#fce7f3','#f3e8ff'];
  var GLYPH=['◆','✦','✧','▣','◈','✳','⚙','✺'];
  function h(tag,cls,html){var e=document.createElement(tag);if(cls)e.className=cls;if(html!=null)e.innerHTML=html;return e;}
  function firstText(el){
    var best='';
    el.querySelectorAll('*').forEach(function(n){
      if(n.children.length)return;
      var s=(n.textContent||'').trim();
      if(s.length>best.length&&s.length<220)best=s;
    });
    return best;
  }
  function decorateCards(host){
    if(!host)return;
    var kids=Array.prototype.slice.call(host.children);
    kids.forEach(function(card,idx){
      if(card.classList.contains('mg-done'))return;
      card.classList.add('mg-done');
      var raw=card.innerHTML;
      if(card.querySelector('.mg-tile'))return;
      var texts=[];
      card.querySelectorAll('*').forEach(function(n){if(!n.children.length){var s=(n.textContent||'').trim();if(s)texts.push(s);}});
      var name=texts[0]||'';
      var desc=texts.slice(1).join(' ').slice(0,140)||'';
      card.innerHTML='';
      var tile=h('div','mg-tile',GLYPH[idx%GLYPH.length]);
      tile.style.background=TILES[idx%TILES.length];
      card.appendChild(tile);
      card.appendChild(h('div','mg-name',name));
      if(desc)card.appendChild(h('div','mg-desc',desc));
      card.appendChild(h('div','mg-tags','<span>'+(host.id==='toolsBody'?'内置 · 随程序提供':'本地 · 可用')+'</span>'));
    });
    if(!kids.length&&!host.querySelector('.mg-empty')){
      host.appendChild(h('div','mg-empty','这里还是空的。点上面的按钮加一条，或者直接让智能体自己总结一条。'));
    }
  }
  function addTileRow(){
    // 侧栏图标不做：原有条目本来就有自己的符号，再插一个会变成一行两个图标。
  }
  function buildBar(){
    var view=document.getElementById('view-skills');
    if(!view||view.querySelector('.mg-bar'))return;
    var bar=h('div','mg-bar');
    bar.innerHTML='<span class="mg-tab on" data-pane="skillsBody">技能</span><span class="mg-tab" data-pane="toolsBody">插件</span><span class="mg-tab" data-pane="mcp">MCP</span>'+
      '<input class="mg-search" placeholder="搜索技能">';
    var cats=h('div','mg-bar');cats.style.gap='8px';cats.id='mg-cats';
    cats.innerHTML='<span class="mg-pill on" data-cat="全部">全部</span>';
    view.insertBefore(cats,view.firstChild);
    view.insertBefore(bar,view.firstChild);
    var mcp=h('div','mg-empty','MCP 服务端暂未支持。插件页列的是智能体当前真正能调用的工具。');
    mcp.id='mg-mcp';mcp.style.display='none';
    view.appendChild(mcp);
    var search=bar.querySelector('.mg-search');
    function apply(){
      var q=(search.value||'').trim().toLowerCase();
      var cat=(cats.querySelector('.mg-pill.on')||{}).dataset?cats.querySelector('.mg-pill.on').dataset.cat:'全部';
      var body=document.getElementById('skillsBody');
      if(!body)return;
      Array.prototype.forEach.call(body.children,function(c){
        var text=(c.textContent||'').toLowerCase();
        var okQ=!q||text.indexOf(q)>=0;
        var okC=cat==='全部'||(cat==='其他'?!['效率','办公','技术','内容','数据','运维'].some(function(k){return text.indexOf(k)>=0;}):text.indexOf(cat.slice(0,2))>=0);
        c.style.display=(okQ&&okC)?'':'none';
      });
    }
    search.addEventListener('input',apply);
    cats.addEventListener('click',function(e){
      if(!e.target.dataset.cat)return;
      cats.querySelectorAll('.mg-pill').forEach(function(p){p.classList.toggle('on',p===e.target);});
      cats.dataset.pick=e.target.dataset.cat;
      sig='';renderSkills();
      apply();
    });
    bar.addEventListener('click',function(e){
      var pane=e.target.dataset&&e.target.dataset.pane;if(!pane)return;
      bar.querySelectorAll('.mg-tab').forEach(function(t){t.classList.toggle('on',t===e.target);});
      var sb=document.getElementById('skillsBody'),tb=document.getElementById('toolsBody'),m=document.getElementById('mg-mcp');
      if(sb)sb.style.display=(pane==='skillsBody')?'':'none';
      if(tb)tb.style.display=(pane==='toolsBody')?'':'none';
      if(m)m.style.display=(pane==='mcp')?'':'none';
    });
  }
  var sig='';
  function renderSkills(){
    var body=document.getElementById('skillsBody');
    if(!body)return;
    fetch('/api/skills').then(function(r){return r.json();}).then(function(d){
      if(!d||!d.ok)return;
      var items=(d.builtins||[]).slice();
      var names={};items.forEach(function(i){names[i.name]=1;});
      (d.skills||[]).forEach(function(s){
        if(!names[s.name])items.push({name:s.name,description:s.description||'我自己写的技能',category:'我的',installed:true,custom:true});
      });
      var next=items.map(function(i){return i.name+(i.installed?'+':'-');}).join('|')+((document.getElementById('mg-cats')||{dataset:{}}).dataset.pick||'');
      if(next===sig)return;sig=next;
      var view=document.getElementById('view-skills');
      if(view&&!view.querySelector('.mg-intro')){
        var intro=h('div','mg-intro','');
        intro.style.cssText='font-size:13px;color:#6b7280;line-height:1.6;max-width:520px;margin:0 0 12px';
        intro.textContent='为你的智能体提供预封装、可重复的最佳实践与工具';
        if(cats.parentNode===view)view.insertBefore(intro,cats);else view.insertBefore(intro,view.firstChild);
      }
      var catBox=document.getElementById('mg-cats');
      var cur=(catBox&&catBox.dataset.pick)||'全部';
      body.innerHTML='';
      if(catBox){
        var seen={},order=['全部','精选'];
        items.forEach(function(i){var c=i.category||'其他';if(!seen[c]){seen[c]=1;order.push(c);}});
        catBox.innerHTML='';
        order.forEach(function(c){
          var pill=h('span','mg-pill'+(c===cur?' on':''),c);
          pill.dataset.cat=c;catBox.appendChild(pill);
        });
      }
      var shown=items.filter(function(i){return cur==='全部'||cur==='精选'||(i.category||'其他')===cur;});
      if(!shown.length){
        body.appendChild(h('div','mg-empty',items.length?'这个分类下还没有技能。':'还没有技能。点「创建技能」写一条，或者直接让智能体自己总结一条。'));
        return;
      }
      shown.forEach(function(it,idx){
        var card=h('div','mg-done mg-card');
        var tile=h('div','mg-tile',GLYPH[idx%GLYPH.length]);
        tile.style.background=TILES[idx%TILES.length];
        card.appendChild(tile);
        var main=h('div','mg-main');
        var head=h('div','mg-head');
        head.appendChild(h('span','mg-name',it.name));
        var btn=h('div','mg-btn',(it.installed?'✓ 已安装':'⬇ 安装'));
        btn.dataset.skill=it.name;btn.dataset.on=it.installed?'1':'0';
        head.appendChild(btn);
        main.appendChild(head);
        main.appendChild(h('div','mg-desc',it.description||''));
        main.appendChild(h('div','mg-tags','Server · v1.0.0'));
        card.appendChild(main);
        body.appendChild(card);
      });
    }).catch(function(){});
  }
  document.addEventListener('click',function(e){
    var b=e.target.closest?e.target.closest('.mg-btn'):null;
    if(!b||!b.dataset.skill)return;
    var name=b.dataset.skill,on=b.dataset.on==='1';
    b.textContent=on?'卸载中…':'安装中…';
    fetch('/api/skills',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify(on?{uninstall:name}:{install:name})})
      .then(function(r){return r.json();}).then(function(d){
        var hint=document.getElementById('hint');
        if(hint)hint.textContent=d&&d.ok?(on?('已卸载「'+name+'」'):('已安装「'+name+'」，之后每次任务都会照它做')):('操作失败：'+((d&&d.error)||'原因未知'));
        sig='';renderSkills();
      }).catch(function(){b.textContent=on?'已安装':'安装';});
  });
  function tick(){
    try{
      // 这里全部停用：技能页已经改由后面的自建渲染负责，
      // 两套一起画会出现两组页签和两个搜索框。
      // 智能体页、工具页本来就交回原有逻辑，装饰层不再碰任何原有 DOM。
    }catch(e){}
  }
  tick();
  setInterval(tick,1200);
  new MutationObserver(tick).observe(document.documentElement,{childList:true,subtree:true});
})();
</script>

<script>
/* 技能页自建渲染：完全不依赖原有 DOM，接口给什么就画什么。
   上一版是往原有结构里插东西，原有结构一变就白屏——这次自己造整页。 */
(function(){
  var TILES=['#eef2ff','#e0f2fe','#f0fdf4','#fef3c7','#fce7f3','#f3e8ff'];
  var GLYPH=['◆','✦','✧','▣','◈','✳','⚙','✺','❖','✤'];
  function el(tag,cls,text){var e=document.createElement(tag);if(cls)e.className=cls;if(text!=null)e.textContent=text;return e;}
  function open(kind){
    try{
      var item=document.querySelector('[data-view="'+kind+'"]')||document.querySelector('[data-view="'+kind.replace('skills','skills')+'"]');
      if(item){item.click();return true;}
    }catch(e){}
    return false;
  }
  var cat='全部', q='', items=null, sig='';
  function card(it,i){
    var c=el('div','mg-done mg-card');
    var tile=el('div','mg-tile',GLYPH[i%GLYPH.length]);
    tile.style.background=TILES[i%TILES.length];
    c.appendChild(tile);
    var main=el('div','mg-main');
    var head=el('div','mg-head');
    head.appendChild(el('span','mg-name',it.name));
    var b=el('button','mg-btn',it.installed?'✓ 已安装':'⬇ 安装');
    b.dataset.skill=it.name;b.dataset.on=it.installed?'1':'0';
    head.appendChild(b);
    main.appendChild(head);
    main.appendChild(el('div','mg-desc',it.description||''));
    main.appendChild(el('div','mg-tags','Server · v1.0.0'));
    c.appendChild(main);
    return c;
  }
  function paint(grid){
    grid.innerHTML='';
    var shown=(items||[]).filter(function(i){
      if(cat!=='全部'&&cat!=='精选'&&(i.category||'其他')!==cat)return false;
      if(!q)return true;
      return ((i.name||'')+(i.description||'')+(i.category||'')).toLowerCase().indexOf(q)>=0;
    });
    if(!shown.length){
      var empty=el('div','mg-empty',(items&&items.length)?'这个分类下还没有技能。':'还没有技能。点「创建技能」写一条，或者直接让智能体自己总结一条。');
      grid.appendChild(empty);return;
    }
    shown.forEach(function(it,i){grid.appendChild(card(it,i));});
  }
  function build(){
    var view=document.getElementById('view-skills');
    if(!view)return;
    var box=document.getElementById('mg-skills');
    if(!box){
      box=el('div');box.id='mg-skills';
      box.style.cssText='padding:22px 26px';
      view.appendChild(box);
    }
    if(!box.dataset.ready){
      box.dataset.ready='1';
      var intro=el('div','','为你的智能体提供预封装、可重复的最佳实践与工具');
      intro.style.cssText='font-size:13px;color:#6b7280;line-height:1.6;max-width:520px;margin:0 0 14px';
      box.appendChild(intro);
      var tabs=el('div');tabs.style.cssText='display:flex;gap:22px;align-items:center;border-bottom:1px solid #ececf1;margin-bottom:14px';
      ['技能','插件','MCP'].forEach(function(n,i){
        var tb=el('span','mg-tab'+(i===0?' on':''),n);
        tb.style.cssText='padding:9px 0;cursor:pointer';
        tb.onclick=function(){ if(n==='技能'){open('skills');} else if(n==='插件'){open('tools');} else {alert('MCP 服务端暂未支持。插件页列的是智能体当前真正能调用的工具。');} };
        tabs.appendChild(tb);
      });
      box.appendChild(tabs);
      var row=el('div');row.style.cssText='display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:12px';
      var cats=el('div');cats.id='mg-cats';
      cats.style.cssText='display:flex;gap:0;flex-wrap:wrap;flex:1;min-width:0';
      row.appendChild(cats);
      var search=el('input');search.className='mg-search';search.placeholder='搜索技能';
      search.style.cssText='height:40px;min-width:220px;max-width:280px;border:1px solid #ececf1;border-radius:10px;padding:0 14px;background:#fff;font-size:13.5px;outline:none';
      search.oninput=function(){q=(search.value||'').trim().toLowerCase();paint(grid);};
      row.appendChild(search);
      box.appendChild(row);
      var grid=el('div');grid.id='mg-grid';
      grid.style.cssText='display:grid;grid-template-columns:repeat(auto-fill,minmax(420px,1fr));gap:16px;align-content:start';
      box.appendChild(grid);
      var tip=el('div','','没有头绪？让智能体自己总结经验存成技能——直接对它说「把刚才的做法存成技能」。');
      tip.style.cssText='font-size:12.5px;color:#9aa1ab;margin-top:16px';
      box.appendChild(tip);
    }
    var grid=document.getElementById('mg-grid'),cats=document.getElementById('mg-cats');
    fetch('/api/skills').then(function(r){return r.json();}).then(function(d){
      if(!d||!d.ok){grid.innerHTML='<div class="mg-empty">读不到技能列表，检查本地服务是否在运行。</div>';return;}
      var list=(d.builtins||[]).slice();
      var names={};list.forEach(function(i){names[i.name]=1;});

      items=list;
      var next=list.map(function(i){return i.name+(i.installed?'+':'-');}).join('|');
      if(next!==sig){
        sig=next;
        var seen={},order=['全部','精选'];

<script>

(function(){
  var TILES=['#eef2ff','#e0f2fe','#f0fdf4','#fef3c7'];
  function el(tag,cls,text){var e=document.createElement(tag);if(cls)e.className=cls;if(text!=null)e.textContent=text;return e;}
  function post(path,body){return fetch(path,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)}).then(function(r){return r.json();});}
  var view=null;
  function ensureView(){
    if(view)return view;
    view=document.getElementById('view-automations');
    if(!view){
      view=el('div','view');view.id='view-automations';
      var host=document.getElementById('view-chat');
      (host&&host.parentNode?host.parentNode:document.body).appendChild(view);

    if(!last)return;

    nav.id='mg-nav-auto';
    nav.setAttribute('data-view','automations');
    nav.classList.remove('active','on');
    nav.textContent='自动化(RPA)';
    var svg=last.querySelector('svg');
    if(svg)nav.insertBefore(svg.cloneNode(true),nav.firstChild);
    last.parentNode.insertBefore(nav,last.nextSibling);
    nav.onclick=function(e){
      e.preventDefault();e.stopPropagation();
      document.querySelectorAll('.view').forEach(function(v){v.style.display='none';});
      document.querySelectorAll('[data-view]').forEach(function(i){if(i.id!=='mg-nav-auto')i.classList.remove('active','on');});
      nav.classList.add('active');
      ensureView().style.display='block';
      load();
    };
    document.querySelectorAll('[data-view]').forEach(function(i){
      if(i.id==='mg-nav-auto')return;
      i.addEventListener('click',function(){ if(view)view.style.display='none'; });
    });

<script>
/* 侧栏对齐 钧子AI 的结构：
   新建任务 / 项目 / 插件&技能 / 数字专家 / 自动化(RPA) / 定时任务。
   只改标签文字和顺序，不动原有 data-view 的绑定，免得点不动。 */
(function(){
  var MAP={chat:'新建任务',files:'项目',tools:'工具与技能',skills:'插件&技能',agents:'数字专家',models:'模型接入'};
  var ICON={chat:'◈',files:'▤',tools:'⚙',skills:'✦',agents:'☰',models:'◆'};
  function fix(){
    var items=document.querySelectorAll('.nitem[data-view],aside [data-view],.sidebar [data-view]');
    items.forEach(function(i){
      var v=i.getAttribute('data-view');
      if(!v||!MAP[v])return;
      var span=i.querySelector('.ni');
      if(span){span.textContent=ICON[v];}
      // 只替换文字节点，保留图标 span
      for(var n=0;n<i.childNodes.length;n++){
        var c=i.childNodes[n];
        if(c.nodeType===3&&c.textContent.trim()){
          if(c.textContent.trim()!==MAP[v])c.textContent=MAP[v];
        }
      }
      if(v==='chat'){i.classList.add('mg-primary');}
    });
  }
  setInterval(function(){try{fix();}catch(e){}},900);
})();
</script>

<script>
/* 定时任务：单独一页。数据还是 /api/automations，但只展示带定时的，
   并且把「下次什么时候跑」算出来给用户看。 */
(function(){
  function el(tag,cls,text){var e=document.createElement(tag);if(cls)e.className=cls;if(text!=null)e.textContent=text;return e;}
  function post(b){return fetch('/api/automations',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(b)}).then(function(r){return r.json();});}
  function human(sec){
    if(sec==null)return '—';
    var m=Math.round(sec/60);
    if(m<1)return '不到 1 分钟';
    if(m<60)return m+' 分钟后';
    var h=Math.round(m/60);
    if(h<24)return h+' 小时后';
    return Math.round(h/24)+' 天后';
  }
  var view=null;
  function ensureView(){
    if(view)return view;
    view=document.getElementById('view-cron');
    if(!view){
      view=el('div','view');view.id='view-cron';
      var host=document.getElementById('view-chat');
      (host&&host.parentNode?host.parentNode:document.body).appendChild(view);
    }
    return view;
  }
  function ensureNav(){
    if(document.getElementById('mg-nav-cron'))return;
    var auto=document.getElementById('mg-nav-auto');
    if(!auto)return;
    var nav=auto.cloneNode(true);
    nav.id='mg-nav-cron';nav.textContent='定时任务';
    var svg=auto.querySelector('svg');if(svg)nav.insertBefore(svg.cloneNode(true),nav.firstChild);
    auto.parentNode.insertBefore(nav,auto.nextSibling);
    nav.onclick=function(e){
      e.preventDefault();e.stopPropagation();
      document.querySelectorAll('.view').forEach(function(v){v.style.display='none';});
      document.querySelectorAll('[data-view]').forEach(function(i){if(i.id!=='mg-nav-cron')i.classList.remove('active','on');});
      nav.classList.add('active');
      ensureView().style.display='block';
      load();
    };
    document.querySelectorAll('[data-view]').forEach(function(i){
      if(i.id==='mg-nav-cron')return;
      i.addEventListener('click',function(){if(view)view.style.display='none';});
    });
  }
  function render(d){
    var box=ensureView();box.innerHTML='';
    var wrap=el('div');wrap.id='mg-cron';
    var h=el('div',null,'定时任务');h.style.cssText='font-size:19px;font-weight:650;margin-bottom:4px';
    wrap.appendChild(h);
    var s=el('div',null,'到点由本机调度器触发，不需要开着界面。时间写法：每 30 分钟 / 每小时 / 每天 09:00');
    s.style.cssText='font-size:13px;color:#6b7280;margin-bottom:16px';
    wrap.appendChild(s);
    var rows=(d.automations||[]).filter(function(a){return a.schedule;});
    if(!rows.length){
      var e=el('div',null,'还没有定时任务。去「自动化(RPA)」页建一个，填上时间就会出现在这里。');
      e.style.cssText='font-size:13.5px;color:#6b7280;padding:16px 0';

      left.appendChild(el('div',null,a.name)).style.cssText='font-size:14.5px;font-weight:600';
      var m=el('div',null,(a.enabled?'已启用':'已停用')+' · '+a.schedule+' · 下次 '+(a.enabled?human(a.next_run?Math.max(0,a.next_run-Date.now()/1000):null):'（停用中）')
        +(a.last_run?(' · 上次 '+new Date(a.last_run*1000).toLocaleString('zh-CN')):' · 还没跑过'));
      m.style.cssText='font-size:12.5px;color:#9aa1ab;margin-top:4px';
      left.appendChild(m);
      it.appendChild(left);

      var b2=el('button','b','立即运行');
      b2.onclick=function(){
        b2.textContent='运行中…';
        fetch('/api/run',{method:'POST',headers:{'Content-Type':'application/json'},

      };
      it.appendChild(b1);it.appendChild(b2);
      wrap.appendChild(it);
    });
    box.appendChild(wrap);

  function load(){fetch('/api/automations').then(function(r){return r.json();}).then(render).catch(function(){});}
  setInterval(function(){try{ensureNav();}catch(e){}},1200);
})();
</script>
<script>
/* MCP 自定义服务：带密钥输入。有些服务（搜索类）必须填 key 才能用，
   之前只能手改配置文件。 */
(function(){
  function el(tag,cls,text){var e=document.createElement(tag);if(cls)e.className=cls;if(text!=null)e.textContent=text;return e;}
  function inject(){
    var grid=document.getElementById('mg-grid');
    if(!grid||grid.dataset.mcp!=='1'||document.getElementById('mg-mcpform'))return;
    var f=el('div');f.id='mg-mcpform';f.style.gridColumn='1/-1';
    f.appendChild(el('div',null,'自定义 MCP 服务（需要密钥的填在下面）')).style.cssText='font-size:14px;font-weight:600;margin-bottom:10px';
    var rows=[['mcp-name','服务名字，例如 Tavily'],['mcp-cmd','启动命令，例如 npx'],
              ['mcp-args','参数，空格分开：-y @modelcontextprotocol/server-xxx'],
              ['mcp-env','环境变量，一行一个 KEY=VALUE（密钥写这里）']];
    rows.forEach(function(r){
      var i=el('input');i.id=r[0];i.placeholder=r[1];f.appendChild(i);
    });
    var bar=el('div');bar.style.cssText='display:flex;gap:10px;align-items:center';
    var b=el('button','b','保存并启动');b.style.cssText='height:34px;padding:0 16px;background:linear-gradient(135deg,#7c5cff,#35c3e8);color:#fff;border:none;border-radius:9px;cursor:pointer';
    var tip=el('span','');tip.style.cssText='font-size:12.5px;color:#9aa1ab';
    bar.appendChild(b);bar.appendChild(tip);f.appendChild(bar);
    b.onclick=function(){
      var name=f.querySelector('#mcp-name').value.trim();
      var cmd=f.querySelector('#mcp-cmd').value.trim();
      if(!name||!cmd){tip.textContent='名字和命令必填';return;}
      var env={};
      f.querySelector('#mcp-env').value.split('\n').forEach(function(line){
        var i=line.indexOf('=');if(i>0)env[line.slice(0,i).trim()]=line.slice(i+1).trim();
      });
      tip.textContent='启动中…（可能要下载）';
      fetch('/api/mcp',{method:'POST',headers:{'Content-Type':'application/json'},
        body:JSON.stringify({action:'add',name:name,command:cmd,
          args:f.querySelector('#mcp-args').value.trim().split(/\s+/).filter(Boolean),env:env})})
        .then(function(r){return r.json();}).then(function(d){
          if(!d.ok){tip.textContent='失败：'+(d.error||'');return;}
          var s=(d.servers||[]).filter(function(x){return x.name===name;})[0]||{};
          tip.textContent=s.running?('已启动，'+s.tools.length+' 个工具'):('已保存但没起来：'+(s.error||''));
        });
    };
    grid.appendChild(f);
  }
  setInterval(function(){try{inject();}catch(e){}},900);
})();
</script>

<script>
/* 速度／推理强度：档位跟着模型走。
   中转站的模型清单里没有能力字段，所以档位由后端按模型家族判断后下发；
   模型不支持调节时，这个选择器直接隐藏，请求里也不带该字段
   （硬塞给不支持的模型会被 provider 拒绝）。 */
(function(){
  var LABEL={low:'快速',medium:'均衡',high:'深度思考'};
  var efforts={}, current='';
  function currentModel(){
    var btn=document.getElementById('modelBtn')||document.getElementById('mpick');
    if(!btn)return '';
    return (btn.textContent||'').trim().replace(/[▾\u25be\s]+$/,'').trim();
  }
  function rebuild(){
    var sel=document.getElementById('mg-effort');
    if(!sel)return;
    var m=currentModel();
    var levels=efforts[m]||[];
    if(m===current&&sel.dataset.built===levels.join(','))return;
    current=m;sel.dataset.built=levels.join(',');
    sel.innerHTML='';
    if(!levels.length){sel.style.display='none';sel.value='';return;}
    sel.style.display='';
    var o=document.createElement('option');o.value='';o.textContent='默认速度';sel.appendChild(o);
    levels.forEach(function(l){var x=document.createElement('option');x.value=l;x.textContent=LABEL[l]||l;sel.appendChild(x);});
  }
  function inject(){
    var btn=document.getElementById('modelBtn')||document.getElementById('mpick');
    if(!btn||document.getElementById('mg-effort'))return;
    var sel=document.createElement('select');
    sel.id='mg-effort';sel.title='推理强度：越深越慢但更准；档位由模型决定';
    sel.style.cssText='height:32px;border:1px solid #ececf1;border-radius:8px;padding:0 8px;font-size:12.5px;background:#fff;color:#4b5563;margin-left:8px;cursor:pointer;display:none';
    btn.parentNode.insertBefore(sel,btn.nextSibling);
    fetch('/api/models').then(function(r){return r.json();}).then(function(d){efforts=d.efforts||{};rebuild();});
  }
  var orig=window.fetch;
  window.fetch=function(url,opts){
    try{
      if(String(url).indexOf('/api/run')>=0&&opts&&typeof opts.body==='string'){
        var sel=document.getElementById('mg-effort');
        if(sel&&sel.value){var b=JSON.parse(opts.body);b.effort=sel.value;opts=Object.assign({},opts,{body:JSON.stringify(b)});}
      }
    }catch(e){}
    return orig.call(this,url,opts);
  };
  setInterval(function(){try{inject();rebuild();}catch(e){}},700);
})();
</script>

<script>
/* 任务进行中显示已用时。
   之前只有「执行中…」三个字，慢的时候完全看不出是死是活——
   用户只能干等。现在把秒数报出来：只要数字在走，就说明还活着。 */
(function(){
  var timer=null, started=0, badge=null;
  function el(tag,cls,text){var e=document.createElement(tag);if(cls)e.className=cls;if(text!=null)e.textContent=text;return e;}
  function show(){
    if(!badge){
      badge=el('div');badge.id='mg-progress';
      badge.style.cssText='position:fixed;right:22px;bottom:96px;z-index:9999;background:rgba(31,35,40,.88);color:#fff;font-size:12.5px;padding:7px 13px;border-radius:9px;pointer-events:none;font-variant-numeric:tabular-nums';
      document.body.appendChild(badge);
    }
    badge.style.display='block';
    if(!started)started=Date.now();
    var s=((Date.now()-started)/1000).toFixed(0);
    badge.textContent='任务进行中 · 已用时 '+s+' 秒'+(s>60?'（还在等模型返回）':'');
  }
  function hide(){ if(badge)badge.style.display='none'; started=0; }
  var orig=window.fetch;
  window.fetch=function(url,opts){
    var isRun=String(url).indexOf('/api/run')>=0;
    if(isRun&&opts){
      started=0;show();
      if(timer)clearInterval(timer);
      timer=setInterval(show,500);
    }
    var pr=orig.call(this,url,opts);
    if(isRun){
      pr.then(function(){ if(timer)clearInterval(timer); hide(); })
        .catch(function(){ if(timer)clearInterval(timer); hide(); });
    }
    return pr;
  };
})();
</script>

(function(){

  function inputBox(){
    return document.querySelector('textarea')||document.querySelector('input[type=text]')||document.querySelector('[contenteditable=true]');
  }
  function append(text){
    var box=inputBox();if(!box)return;
    if(box.tagName==='TEXTAREA'||box.tagName==='INPUT'){
      var cur=box.value||'';
      box.value=cur+(cur.trim()?'\n':'')+text;
      box.dispatchEvent(new Event('input',{bubbles:true}));
    }else{
      box.textContent=(box.textContent||'')+text;

  var menu=null, planMode=false;

  function open(anchor){

  font-size:12px;padding:5px 11px;border-radius:8px;display:none}
</style>
<script>
/* 允许「插话」：运行中不再锁输入框，随时可以再发一条。
   服务端本来就是多线程的，能同时处理；之前卡住的真正原因是界面把输入禁用了。
   同时给一个「停止」按钮，能把当前这一轮掐掉。 */
(function(){
  var active=0, controllers=[];
  function el(tag,cls,text){var e=document.createElement(tag);if(cls)e.className=cls;if(text!=null)e.textContent=text;return e;}
  var stop=null, badge=null;
  function ensure(){
    if(!stop){
      stop=el('button',null,'停止这一轮');stop.id='mg-stop';
      stop.onclick=function(){
        controllers.forEach(function(c){try{c.abort();}catch(e){}});
        controllers=[];active=0;
        stop.style.display='none';
        if(badge)badge.style.display='none';
      };
      document.body.appendChild(stop);
    }
    if(!badge){badge=el('div',null,'');badge.id='mg-queue';document.body.appendChild(badge);}
  }
  // 关键：把「运行中」被禁用的输入框和按钮解禁，用户才能插话
  setInterval(function(){
    ensure();
    document.querySelectorAll('textarea,input[type=text]').forEach(function(e){
      if(e.disabled||e.readOnly){e.disabled=false;e.readOnly=false;e.removeAttribute('disabled');}
    });
    document.querySelectorAll('button').forEach(function(b){
      if(b.disabled&&b.id!=='mg-stop'){b.disabled=false;b.removeAttribute('disabled');}
    });
    // 运行中把发送按钮恢复成「发送」，并提示可以插话（消息会排队）。
    // 否则按钮停在「执行中…」，用户根本不会去点。
    var sb=document.getElementById('send');
    if(sb&&(sb.textContent||'').indexOf('执行中')>=0&&!sb.dataset.mgFixed){
      sb.textContent='发送（可插话）';sb.dataset.mgFixed='1';
      sb.addEventListener('blur',function(){delete sb.dataset.mgFixed;});
    }
  },400);
  var orig=window.fetch;
  window.fetch=function(url,opts){
    var isRun=String(url).indexOf('/api/run')>=0;
    if(isRun){
      ensure();
      active+=1;
      stop.style.display='block';
      badge.style.display='block';
      badge.textContent=active>1?('同时进行 '+active+' 轮（插话已生效）'):'进行中，可以继续插话';
      var ctrl=null;
      try{
        if(window.AbortController){
          ctrl=new AbortController();
          opts=Object.assign({},opts,{signal:ctrl.signal});
          controllers.push(ctrl);
        }
      }catch(e){}
      var pr=orig.call(this,url,opts);
      var done=function(){
        active=Math.max(0,active-1);
        if(ctrl)controllers=controllers.filter(function(x){return x!==ctrl;});
        if(active===0){stop.style.display='none';badge.style.display='none';}
        else{badge.textContent='同时进行 '+active+' 轮（插话已生效）';}
      };
      pr.then(done).catch(done);
      return pr;
    }
    return orig.call(this,url,opts);
  };
})();
</script>

<script>
/* 本地模型自动发现：照着零度code做的，但不用后端——
   页面本身就跑在本机，直接去敲常见推理服务的端口即可。
   Ollama / LM Studio / vLLM 都对 localhost 开了 CORS，浏览器能直接读。 */
(function(){
  var SRV=[['Ollama',11434,'/api/tags',function(j){return (j.models||[]).map(function(m){return m.name;});},'http://127.0.0.1:11434/v1'],
           ['LM Studio',1234,'/v1/models',function(j){return (j.data||[]).map(function(m){return m.id;});},'http://127.0.0.1:1234/v1'],
           ['vLLM',8000,'/v1/models',function(j){return (j.data||[]).map(function(m){return m.id;});},'http://127.0.0.1:8000/v1'],
           ['llama.cpp',8080,'/v1/models',function(j){return (j.data||[]).map(function(m){return m.id;});},'http://127.0.0.1:8080/v1']];
  var card=null;
  function el(tag,cls,text){var e=document.createElement(tag);if(cls)e.className=cls;if(text!=null)e.textContent=text;return e;}
  function addProvider(name,url,model){
    fetch('/api/providers',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({name:name,label:name,base_url:url,model:model,api_key:'',wire_api:'chat'})})
    .then(function(r){return r.json();}).then(function(d){
      alert(d.ok===false?('添加失败：'+(d.error||'未知原因')):'已添加接入配置：'+name+' / '+model+'，去上面的下拉框切换即可');
    }).catch(function(e){alert('添加失败：'+e);});
  }
  function scan(){
    var out=document.getElementById('mg-scanout');
    if(!out)return;
    out.innerHTML='<div class="hint">正在扫描本机 11434 / 1234 / 8000 / 8080 …</div>';
    var found=0, left=SRV.length;
    SRV.forEach(function(s){
      var ctrl=null;
      try{ctrl=new AbortController();}catch(e){}
      var timer=setTimeout(function(){try{ctrl.abort();}catch(e){}},2500);
      fetch('http://127.0.0.1:'+s[1]+s[2],{signal:ctrl&&ctrl.signal,headers:{'Accept':'application/json'}})
      .then(function(r){return r.json();})
      .then(function(j){
        var names=s[3](j)||[];
        // 服务在跑但一个模型都没有，也要说出来——不然用户以为没扫到服务，
        // 实际上是服务活着、只是还没下模型，这两种情况的处理办法完全不同。
        if(!names.length){
          var e0=el('div','hint',s[0]+' 已在运行（'+s[4]+'），但里面还没有任何模型——'
            +(s[0]==='Ollama'?'先 ollama pull 一个模型':'先在本地加载一个模型')+'再扫。');
          e0.style.color='#b45309';out.appendChild(e0);found++;

          box.appendChild(el('div',null,s[0]+'  '+s[4]+'  ·  '+names.length+' 个模型'));
          names.slice(0,8).forEach(function(n){
            var row=el('div');row.style.cssText='display:flex;justify-content:space-between;align-items:center;padding:3px 0;font-size:13px';

            b.onclick=function(){addProvider(s[0],s[4],n);};
            row.appendChild(b);box.appendChild(row);
          });
          out.appendChild(box);
        }
      })
      .catch(function(){})
      .then(function(){
        left--;
        if(left===0&&found===0)out.innerHTML='<div class="hint">没发现本机推理服务。装了 Ollama / LM Studio 的话先把服务启动起来再扫。</div>';
        else if(left===0&&found>0)out.querySelectorAll('.hint').forEach(function(h){if(h.textContent.indexOf('正在扫描')>=0)h.remove();});

  function inject(){

    card.style.cssText='margin:14px 0;padding:14px 16px;border:1px solid #ececf1;border-radius:12px;background:#fff';
    var h=el('div',null,'💻  本地模型（自动发现）');
    h.style.cssText='font-weight:600;margin-bottom:4px';
    card.appendChild(h);
    card.appendChild(el('div','hint','扫描本机常见推理服务端口，扫到就能一键加为接入配置，不用手填地址。'));
    var b=el('button',null,'扫描本机');b.style.cssText='margin-top:8px;padding:6px 14px;border:1px solid #ddd;border-radius:8px;background:#fff;cursor:pointer';
    b.onclick=scan;card.appendChild(b);

    host.appendChild(card);
  }
  setInterval(function(){try{inject();}catch(e){}},1000);
})();

<script>
/* 独立的「插话」输入框。
   前几版都在解禁它原有的输入与发送，但它的 busy/live 状态是闭包里的，
   外部改不动，表现始终是一问一答。这一版不再依赖它的内部状态：
   自己发自己的请求、自己渲染自己的回答，一定能用。 */
(function(){
  var log = null;
  function el(tag, text){var e=document.createElement(tag); if(text!=null) e.textContent=text; return e;}
  function getLog(){ if(!log||!document.body.contains(log)) log=document.getElementById('log'); return log; }
  function bubble(text, mine){
    var L=getLog(); if(!L) return null;
    var d=el('div'); d.style.cssText = mine
      ? 'margin:8px 0;padding:10px 13px;background:#f3f0ff;border:1px solid #e4dcff;border-radius:11px;white-space:pre-wrap;font-size:13.5px;line-height:1.65;color:#33336b'
      : 'margin:8px 0;padding:10px 13px;background:#fff;border:1px solid #eee;border-radius:11px;white-space:pre-wrap;font-size:13.5px;line-height:1.65;color:#2f333a';
    d.textContent = text; L.appendChild(d); L.scrollTop = L.scrollHeight; return d;
  }
  function sendMsg(text){
    text=(text||'').trim(); if(!text) return;
    bubble('我（插话）：'+text, true);
    var node=bubble('…', false);
    var acc='';
    fetch('/api/run',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({prompt:text, history:[]})})
    .then(function(res){
      if(!res.ok) throw new Error('服务返回 '+res.status);
      var reader=res.body.getReader(), dec=new TextDecoder(), buf='';
      function pump(){
        return reader.read().then(function(r){
          if(r.done){ node.textContent=acc||'（没有返回内容）'; return; }
          buf+=dec.decode(r.value,{stream:true});
          var lines=buf.split('\n'); buf=lines.pop();
          lines.forEach(function(s){
            if(!s.trim()) return;
            var ev; try{ ev=JSON.parse(s); }catch(e){ return; }
            if(ev.kind==='answer'&&!ev.subagent){ acc+=ev.text; }
            else if(ev.kind==='tool'&&ev.tool){ acc+=''; node.textContent=acc+'\n（正在用 '+ev.tool+'…）'; }
            else if(ev.kind==='error'){ acc+='\n[错误] '+ev.text; }
            node.textContent=acc; if(log) log.scrollTop=log.scrollHeight;
          });
          return pump();
        });
      }
      return pump();
    })
    .catch(function(e){ node.textContent='插话发送失败：'+e; });
  }
  function install(){
    var send=document.getElementById('send');
    if(!send||document.getElementById('mg-interject')) return;
    var wrap=el('div'); wrap.id='mg-interject';
    // 用固定定位浮在窗口底部：之前插进文档流里会被布局挤成 0 高度，
    // 界面上完全看不到，功能等于没有。浮层不受任何布局影响。
    wrap.style.cssText='position:fixed;left:14px;right:14px;bottom:104px;z-index:9997;display:flex;gap:8px;align-items:flex-end;background:rgba(255,255,255,.97);border:1px solid #e4e0ff;border-radius:12px;padding:7px;box-shadow:0 6px 22px rgba(30,20,80,.10)';
    var ta=el('textarea'); ta.id='mg-interject-input';
    ta.placeholder='插话：运行中也能发（回车发送，Shift+回车换行），不会打断当前这轮';
    ta.style.cssText='flex:1;height:36px;resize:none;border:1px solid #e6e6ee;border-radius:10px;padding:8px 11px;font-size:13px;font-family:inherit;outline:none';
    var b=el('button','插话发送');
    b.style.cssText='height:36px;padding:0 15px;border:1px solid #d9d2ff;border-radius:10px;background:#f7f5ff;color:#5b3ee8;cursor:pointer;font-size:13px';
    b.onclick=function(){ sendMsg(ta.value); ta.value=''; };
    ta.onkeydown=function(e){ if(e.key==='Enter'&&!e.shiftKey){ e.preventDefault(); b.onclick(); } };
    wrap.appendChild(ta); wrap.appendChild(b);
    // 必须插在输入框上方、占满整行。
    // 上一版插在 #send 后面（底部那一行的右边），被挤得看不见，所以
    // 用户压根找不到这个框——功能是对的，位置错了等于没有。
    document.body.appendChild(wrap);
  }
  setInterval(function(){ try{ install(); }catch(e){} }, 900);
})();
</script>
</body>
</html>
