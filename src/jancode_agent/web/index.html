<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>JanCode Agent</title>
<style>
  :root{
    --bg:232 33% 5%; --panel:232 28% 9%; --line:232 20% 18%;
    --fg:220 20% 92%; --dim:220 12% 60%;
    --accent:252 90% 68%; --accent2:189 100% 50%; --ok:150 60% 45%; --bad:0 70% 60%;
  }
  *{box-sizing:border-box}
  body{margin:0;background:hsl(var(--bg));color:hsl(var(--fg));
    font:14px/1.6 -apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
    display:flex;flex-direction:column;height:100vh}
  header{padding:12px 18px;border-bottom:1px solid hsl(var(--line));
    display:flex;align-items:center;gap:12px;flex-wrap:wrap}
  .logo{width:26px;height:26px;border-radius:8px;
    background:linear-gradient(135deg,hsl(var(--accent)),hsl(var(--accent2)))}
  h1{font-size:15px;margin:0;font-weight:600}
  .meta{color:hsl(var(--dim));font-size:12px;margin-left:auto;text-align:right}
  main{flex:1;overflow-y:auto;padding:18px;display:flex;flex-direction:column;gap:12px}
  .msg{max-width:820px;padding:10px 14px;border-radius:10px;white-space:pre-wrap;
    word-break:break-word}
  .me{align-self:flex-end;background:hsl(var(--accent)/.18);
    border:1px solid hsl(var(--accent)/.3)}
  .ai{align-self:flex-start;background:hsl(var(--panel));
    border:1px solid hsl(var(--line))}
  .tool{align-self:flex-start;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;
    font-size:12px;color:hsl(var(--dim));border-left:2px solid hsl(var(--line));
    padding:4px 12px;max-width:820px;white-space:pre-wrap}
  .tool.ok{border-left-color:hsl(var(--ok))}
  .tool.bad{border-left-color:hsl(var(--bad));color:hsl(var(--bad))}
  .err{align-self:flex-start;background:hsl(var(--bad)/.12);
    border:1px solid hsl(var(--bad)/.4);color:hsl(var(--bad))}
  .hint{color:hsl(var(--dim));text-align:center;margin-top:40px;font-size:13px}
  footer{border-top:1px solid hsl(var(--line));padding:12px 18px;display:flex;gap:10px}
  textarea{flex:1;background:hsl(var(--panel));color:hsl(var(--fg));
    border:1px solid hsl(var(--line));border-radius:9px;padding:10px 12px;
    font:inherit;resize:none;height:52px;outline:none}
  textarea:focus{border-color:hsl(var(--accent)/.6)}
  button{background:linear-gradient(135deg,hsl(var(--accent)),hsl(var(--accent2)));
    color:#0b0b14;border:0;border-radius:9px;padding:0 20px;font-weight:600;
    cursor:pointer;font-size:14px}
  button:disabled{opacity:.45;cursor:not-allowed}
  .spin{display:inline-block;width:10px;height:10px;border-radius:50%;
    border:2px solid hsl(var(--accent));border-top-color:transparent;
    animation:s .7s linear infinite;vertical-align:-1px;margin-right:6px}
  @keyframes s{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<header>
  <div class="logo"></div>
  <h1>JanCode Agent</h1>
  <div class="meta" id="meta">正在读取配置…</div>
</header>
<main id="log">
  <div class="hint">在下面描述你要做的事，例如「读一下这个项目，告诉我它是干什么的」<br>智能体能读写文件、执行命令，改动都限制在当前工作目录内</div>
</main>
<footer>
  <textarea id="input" placeholder="描述你的任务…（Enter 发送，Shift+Enter 换行）"></textarea>
  <button id="send">发送</button>
</footer>
<script>
const log = document.getElementById('log');
const input = document.getElementById('input');
const send = document.getElementById('send');
let history = [], busy = false;

fetch('/api/info').then(r => r.json()).then(d => {
  document.getElementById('meta').innerHTML =
    `${d.label} · ${d.model}<br>${d.workspace}`;
  if (!d.has_key) {
    const w = document.createElement('div');
    w.className = 'msg err';
    w.textContent = '未检测到 API 密钥。请设置环境变量 JANCODE_API_KEY 后重启服务。';
    log.appendChild(w);
  }
}).catch(() => {
  document.getElementById('meta').textContent = '无法读取配置';
});

function add(cls, text) {
  const el = document.createElement('div');
  el.className = 'msg ' + cls;
  el.textContent = text;
  log.appendChild(el);
  log.scrollTop = log.scrollHeight;
  return el;
}

async function run() {
  const prompt = input.value.trim();
  if (!prompt || busy) return;
  busy = true; send.disabled = true; input.value = '';

  const hint = log.querySelector('.hint');
  if (hint) hint.remove();
  add('msg me', prompt);
  history.push({ role: 'user', content: prompt });

  const status = document.createElement('div');
  status.className = 'tool';
  status.innerHTML = '<span class="spin"></span>思考中…';
  log.appendChild(status); log.scrollTop = log.scrollHeight;

  let answer = '';
  try {
    const resp = await fetch('/api/run', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ prompt, history: history.slice(0, -1) }),
    });
    if (!resp.ok) throw new Error('HTTP ' + resp.status);

    const reader = resp.body.getReader();
    const decoder = new TextDecoder();
    let buf = '';
    while (true) {
      const { value, done } = await reader.read();
      if (done) break;
      buf += decoder.decode(value, { stream: true });
      const lines = buf.split('\n');
      buf = lines.pop();
      for (const line of lines) {
        if (!line.trim()) continue;
        let ev; try { ev = JSON.parse(line); } catch { continue; }
        if (ev.kind === 'tool') {
          if (ev.text) {
            status.className = 'tool ' + (ev.ok ? 'ok' : 'bad');
            status.textContent = ev.tool + '  ' + ev.text.split('\n')[0].slice(0, 160);
            status = document.createElement('div');
            status.className = 'tool';
            status.innerHTML = '<span class="spin"></span>继续中…';
            log.appendChild(status);
          } else {
            status.innerHTML = '<span class="spin"></span>' + ev.tool + ' …';
          }
        } else if (ev.kind === 'answer') {
          answer = ev.text;
        } else if (ev.kind === 'error') {
          status.remove();
          add('msg err', ev.text);
          status = document.createElement('div');
        }
        log.scrollTop = log.scrollHeight;
      }
    }
  } catch (e) {
    add('msg err', '请求失败：' + e.message);
  }
  status.remove();
  if (answer) {
    add('msg ai', answer);
    history.push({ role: 'assistant', content: answer });
  }
  busy = false; send.disabled = false; input.focus();
}

send.onclick = run;
input.onkeydown = e => {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); run(); }
};
input.focus();
</script>
</body>
</html>
