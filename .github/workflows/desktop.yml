name: desktop

# 三个入口各有用途：
#   release: published —— 发版时自动把安装包挂到 Release（主路径）
#   tag push           —— 打 tag 也能触发，忘了点「发布」也出得来
#   workflow_dispatch  —— 手动补一次构建
on:
  release:
    types: [published]
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            label: macOS arm64
            artifact: JanCode-Agent-macos-arm64
          - os: macos-13
            label: macOS x64
            artifact: JanCode-Agent-macos-x64
          - os: windows-latest
            label: Windows x64
            artifact: JanCode-Agent-windows-x64
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[desktop]" pyinstaller

      - name: 冻结成应用
        run: pyinstaller --noconfirm --clean packaging/jancode-desktop.spec

      - name: 冒烟测试（确认冻出来的东西真能启动）
        shell: bash
        run: |
          set -e
          if [ "${{ runner.os }}" = "macOS" ]; then
            BIN="dist/JanCode 智能体.app/Contents/MacOS/JanCode 智能体"
          else
            BIN="dist/JanCode-Agent.exe"
          fi
          # 故意不给密钥：这一步要验证的正是「冻结后的导入链通不通、
          # 缺配置时会不会给出人话提示」。跑了就退出码 2，并且必须打印那句话。
          set +e
          OUT="$("$BIN" --selftest 2>&1)"
          CODE=$?
          set -e
          echo "$OUT"
          if [ "$CODE" != "2" ]; then
            echo "::error::缺密钥时应当以退出码 2 结束，实际是 $CODE"; exit 1
          fi
          case "$OUT" in
            *"未提供 API 密钥"*) echo "冒烟测试通过" ;;
            *) echo "::error::没有给出「未提供 API 密钥」提示，说明冻结后启动路径断了"; exit 1 ;;
          esac

      - name: 打包（macOS）
        if: runner.os == 'macOS'
        run: |
          cd dist
          # 必须用 ditto：zip 会丢掉 .app 里的符号链接和可执行权限，
          # 解压出来的 app 双击会报「已损坏」。
          ditto -c -k --sequesterRsrc --keepParent "JanCode 智能体.app" "${{ matrix.artifact }}.zip"

      - name: 打包（Windows）
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Compress-Archive -Path "dist/JanCode-Agent.exe" -DestinationPath "${{ matrix.artifact }}.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}.zip

      - name: 挂到 Release
        if: github.event_name == 'release' || startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.artifact }}.zip
