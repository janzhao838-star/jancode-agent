[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jancode-agent"
version = "0.1.0"
description = "JanCode Agent —— 开源终端 AI 编程助手，面向国内大模型与自建中转站"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "janzhao" }]
keywords = ["ai", "agent", "coding-assistant", "llm", "deepseek", "openai-compatible"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3.11",
  "Topic :: Software Development",
]

# 运行期依赖刻意保持极少：只用标准库即可启动。
# httpx 用于异步 HTTP；不引入任何 agent 框架，避免被上游绑定。
dependencies = ["httpx>=0.27"]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24"]

[project.scripts]
# 两个名字都给：安装脚本创建的启动命令叫 jancode-agent，文档里也是这么写的，
# 而 pip 安装只会生成 pyproject 里声明的命令。缺了别名的话，
# 用 pip 安装的人照着 README 敲 jancode-agent 会得到 command not found。
jancode = "jancode_agent.cli:main"
jancode-agent = "jancode_agent.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

# 界面文件必须显式声明成包数据，否则它不会进 wheel：
# setuptools 默认只打包 .py，web/index.html 会被静默丢掉。
# 症状很隐蔽——editable 安装（安装脚本用的 -e）直接读源码目录，一切正常；
# 只有普通安装或 wheel 之后才会发现 site-packages 里没有这个文件，
# 于是 jancode --web 每个请求都报 FileNotFoundError。
[tool.setuptools.package-data]
jancode_agent = ["web/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
# 测试要 import 包自身与 tests.mock_server，两者都需在路径上
pythonpath = ["src", "."]
